<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folkfeed</title>
<meta name="description" content="Federated video, ranked on your device by a recipe you control.">
<meta name="application-name" content="Folkfeed">
<meta name="apple-mobile-web-app-title" content="Folkfeed">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'self' https: wss: ws://localhost:* ws://127.0.0.1:*; frame-src 'self' https:; media-src https:; object-src 'none'; base-uri 'self'; form-action 'none'">

<meta name="theme-color" content="#7046c9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141c" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<div id="app"><p style="padding:16px">Loading Folkfeed…</p></div>

</html>
